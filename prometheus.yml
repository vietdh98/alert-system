global:
  scrape_interval:     15s
  evaluation_interval: 15s

rule_files:
  - rules.yml
  
alerting:
  alertmanagers:
   - static_configs:
     - targets:
        - alertmanager:9093

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: [ 'localhost:9090' ]
  - job_name: 'tempo'
    static_configs:
      - targets: [ '172.30.0.7:3200' ]
  - job_name: k8s-app-quochoi
    honor_labels: true
    metrics_path: '/federate'
    params:
      match[]:
        - '{__name__=~ "(aggregator_|apiserver_|Catalina_|container_|etcd_|grpc_server_|kube_|kubelet_|kubernetes_|process_|prometheus_|reloader_|rest_client_requests_total|scheduler_|cluster|cluster_quantile|cluster_verb_scope|cluster_verb_scope_le|code|code_resource|code_verb|count|instance|instance_device|jmx_|jvm_|namespace_cpu|namespace_memory|namespace_workload_pod|node_namespace_pod|node_namespace_pod_container|node_quantile|x509_).*"}'
    static_configs:
      - targets:
        - '10.129.10.35:30014'
